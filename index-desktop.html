<style>
:root{--cyan:#00f6ff;--magenta:#ff00ff}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#050608;color:white;overflow-x:hidden}
.container{width:100%;min-height:80vh;display:flex;align-items:stretch;justify-content:space-between}
.vitrine-texto{width:28%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;color:var(--cyan);text-align:center;font-weight:bold;gap:16px}
.fachada-area{width:42%;display:flex;justify-content:center;align-items:center;padding:20px}
.fachada-area img{width:100%;max-height:85vh;object-fit:contain;filter:drop-shadow(0 0 20px rgba(0,246,255,0.15))}
.painel-lateral{width:30%;background:linear-gradient(to bottom, rgba(25,25,25,0.96), rgba(10,10,10,0.96));border-left:2px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:20px;overflow-y:auto}
.bloco{width:100%;padding:16px;border-radius:14px;background:rgba(0,0,0,0.35);border:1px solid rgba(0,255,255,0.35);box-shadow:0 0 12px rgba(0,255,255,0.25);font-size:14px;color:var(--cyan);text-align:center;cursor:pointer;text-transform:uppercase}
.botao-loja{width:95%;min-height:88px;border-radius:18px;background:rgba(255,255,255,0.05);border:2px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:14px;padding:12px;color:white;transition:0.25s;cursor:pointer;position:relative}
.botao-loja img{width:80px;object-fit:contain}
.botao-loja:hover{transform:scale(1.02);border-color:rgba(0,246,255,0.5);box-shadow:0 0 20px rgba(0,246,255,0.2)}
.botao-loja.ativo{border-color:var(--cyan);background:rgba(0,246,255,0.12);box-shadow:0 0 25px rgba(0,246,255,0.35), 0 0 40px rgba(255,0,255,0.15);transform:scale(1.04)}
.botao-loja.embreve{opacity:0.45}
.botao-loja.embreve::after{content:"EM BREVE";position:absolute;top:6px;right:6px;background:rgba(255,255,255,0.15);font-size:8px;padding:2px 5px;border-radius:4px}
.categorias-section{display:none;width:100%;padding:30px 20px;background:linear-gradient(to bottom, rgba(5,6,8,0.98), rgba(12,14,20,0.98));border-top:2px solid rgba(0,246,255,0.2)}
.categorias-section.visivel{display:block;animation:fadeIn 0.4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.categorias-header{max-width:1200px;margin:0 auto 20px;text-align:center}
.categorias-header h2{color:var(--cyan);letter-spacing:0.12em;margin:0 0 6px;text-shadow:0 0 10px var(--cyan);font-size:18px}
.categorias-header p{color:#888;font-size:13px;margin:0}
.categorias-header .plataforma-nome{color:var(--magenta);font-weight:bold;text-shadow:0 0 8px var(--magenta)}
.categorias-grid{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.cat-item{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:14px;overflow:hidden;transition:0.25s;text-decoration:none;color:white;display:block}
.cat-item:hover{transform:translateY(-4px);border-color:var(--cyan);box-shadow:0 8px 25px rgba(0,246,255,0.15)}
.cat-item img{width:100%;height:140px;object-fit:cover;display:block}
.cat-item .cat-info{padding:10px;text-align:center}
.cat-item .cat-info h4{margin:0 0 6px;font-size:13px}
.cat-item .cat-info span{display:inline-block;background:var(--cyan);color:#000;font-size:11px;font-weight:800;padding:6px 12px;border-radius:8px}
.cat-item.magalu span{background:#0086ff;color:white}
.cat-item.amazon span{background:#ff9900;color:white}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;justify-content:center;align-items:center;z-index:9999;padding:16px}
.form-container{background:rgba(255,255,255,0.95);padding:30px;border-radius:10px;width:90%;max-width:500px;color:black;max-height:90vh;overflow-y:auto}
.account-container{background:rgba(0,0,0,0.85);padding:30px;border-radius:10px;width:90%;max-width:500px;text-align:center;color:white}
@media(max-width:1024px){.categorias-grid{grid-template-columns:repeat(3,1fr)}.container{flex-wrap:wrap}.vitrine-texto{width:50%;order:1}.fachada-area{width:100%;order:0;max-height:50vh}.painel-lateral{width:50%;order:2}}
@media(max-width:768px){.container{flex-direction:column}.vitrine-texto{width:100%;flex-direction:row;flex-wrap:wrap}.bloco{width:calc(50% - 8px);font-size:11px;padding:10px}.fachada-area{width:100%}.painel-lateral{width:100%;flex-direction:row;flex-wrap:wrap}.botao-loja{width:calc(50% - 10px);min-height:75px}.categorias-grid{grid-template-columns:repeat(2,1fr)}}
</style>
