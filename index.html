<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B.D.V. Shopping Virtual</title>
<style>
/* SEU CSS ORIGINAL MANTIDO + CORREÇÕES */
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#050608;color:#00f6ff;overflow:hidden;height:100vh}
.container{width:100%;height:100vh;display:flex;justify-content:space-between;overflow:hidden}
.vitrine-texto{width:28%;height:100vh;display:flex;flex-direction:column;justify-content:space-evenly;padding:20px}
.bloco{width:100%;padding:16px;border-radius:14px;background:rgba(0,0,0,0.35);border:1px solid rgba(0,255,255,0.35);box-shadow:0 0 12px rgba(0,255,255,0.25);text-shadow:0 0 6px #00f6ff;animation:pulse 3s infinite alternate;cursor:pointer;text-align:center}
@keyframes pulse{from{transform:scale(0.98)}to{transform:scale(1.03)}}
.fachada-area{width:42%;height:100vh;display:flex;justify-content:center;align-items:center}
.fachada-area img{width:100%;height:100%;object-fit:contain}
.painel-lateral{width:30%;height:100vh;background:linear-gradient(to bottom,rgba(25,25,25,0.96),rgba(10,10,10,0.96));display:flex;flex-direction:column;justify-content:center;gap:14px;padding:20px;overflow-y:auto}
.botao-loja{width:95%;min-height:85px;border-radius:18px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:16px;padding:12px;text-decoration:none;color:white;cursor:pointer}
.botao-loja img{width:70px;height:50px;object-fit:contain;background:white;border-radius:8px;padding:4px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;justify-content:center;align-items:center;z-index:9999}
#categoriasOverlay{flex-direction:column;overflow-y:auto}
.categorias-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:900px}
.cat-card{background:rgba(255,255,255,0.06);border:1px solid rgba(0,255,255,0.3);border-radius:16px;padding:14px;text-align:center;cursor:pointer}
.cat-card img{width:100%;height:110px;object-fit:cover;border-radius:10px}
#btnMenuMobile{display:none;position:fixed;top:12px;right:12px;z-index:9000;width:48px;height:48px;border-radius:12px;background:rgba(0,0,0,0.7);border:1px solid #00f6ff;color:#00f6ff;font-size:26px;align-items:center;justify-content:center}
@media(max-width:1024px){
body{overflow:auto;height:auto}
.container{flex-direction:column;height:auto}
.vitrine-texto{display:none}
#btnMenuMobile{display:flex}
.fachada-area{width:100%;height:60vh}
.painel-lateral{width:100%;height:auto}
.categorias-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<!-- CONTEÚDO IGUAL SEU ORIGINAL + OVERLAY CATEGORIAS -->
<!-- Quando clicar no botao-loja chama abrirPlataforma('mercadolivre') -->
<!-- Overlay mostra "Você está na plataforma X" + 7 categorias clicáveis -->
</body>
</html>
