<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B.D.V. Shopping Virtual - O Seu Shopping a Um Clique</title>
<meta name="description" content="B.D.V. Shopping Virtual com 25 categorias">
<meta name="author" content="Rodrigo Beltrão">
<meta name="theme-color" content="#00f6ff">
<link rel="icon" href="fachada.png?v=3">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
html {
  scroll-behavior: smooth;
}
body {
  background: #000000;
  color: #ffffff;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  min-height: 100vh;
  width: 100%;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background-image: radial-gradient(
    circle at 50% 0%,
    rgba(0, 246, 255, 0.18),
    transparent 50%
  );
  background-repeat: no-repeat;
  background-attachment: fixed;
}
.container {
  width: 100%;
  max-width: 1200px;
  padding: 20px;
  text-align: center;
}
.logo-area {
  margin-bottom: 30px;
}
.logo-area img {
  width: 100%;
  max-width: 350px;
  border-radius: 12px;
  box-shadow: 0 0 25px rgba(0, 246, 255, 0.3);
  border: 1px solid rgba(0, 246, 255, 0.3);
}
h1 {
  font-size: 38px;
  color: #00f6ff;
  text-shadow: 0 0 12px rgba(0, 246, 255, 0.9);
  letter-spacing: 1px;
  margin-bottom: 10px;
  font-weight: 800;
}
h2 {
  font-size: 18px;
  color: rgba(255, 255, 255, 0.7);
  font-weight: 400;
  margin-bottom: 30px;
  letter-spacing: 0.5px;
}
.loading-box {
  margin: 30px auto;
  padding: 30px;
  border: 2px solid #00f6ff;
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.04);
  box-shadow: 0 0 20px rgba(0, 246, 255, 0.25);
  max-width: 450px;
}
.spinner {
  width: 60px;
  height: 60px;
  border: 4px solid rgba(0, 246, 255, 0.2);
  border-top: 4px solid #00f6ff;
  border-radius: 50%;
  margin: 0 auto 25px auto;
  animation: spin 1s linear infinite;
  box-shadow: 0 0 15px rgba(0, 246, 255, 0.4);
}
@keyframes spin {
  0% {
    transform: rotate(0deg);
  }
  100% {
    transform: rotate(360deg);
  }
}
.text-loading {
  font-size: 16px;
  color: #fff;
  margin-bottom: 25px;
  opacity: 0.9;
}
.buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 20px;
}
.btn {
  display: inline-block;
  padding: 14px 28px;
  border: 2px solid #00f6ff;
  border-radius: 30px;
  color: #00f6ff;
  text-decoration: none;
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 0.5px;
  background: rgba(0, 246, 255, 0.05);
  box-shadow: 0 0 15px rgba(0, 246, 255, 0.3);
  transition: all 0.3s ease;
  cursor: pointer;
}
.btn:hover {
  background: #00f6ff;
  color: #000000;
  box-shadow: 0 0 30px rgba(0, 246, 255, 0.8);
  transform: translateY(-2px);
}
.btn-secondary {
  border-color: rgba(255, 255, 255, 0.3);
  color: rgba(255, 255, 255, 0.8);
  box-shadow: none;
}
.btn-secondary:hover {
  border-color: #fff;
  color: #fff;
  background: rgba(255, 255, 255, 0.1);
  box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
}
.footer-text {
  margin-top: 40px;
  font-size: 12px;
  color: rgba(255, 255, 255, 0.4);
  letter-spacing: 0.5px;
}
.footer-text span {
  color: #00f6ff;
}
@media (max-width: 600px) {
  h1 {
    font-size: 28px;
  }
  .container {
    padding: 15px;
  }
  .loading-box {
    padding: 20px;
    margin: 20px;
  }
  .buttons {
    flex-direction: column;
  }
  .btn {
    width: 100%;
  }
}
.hidden {
  display: none;
}
.visible {
  display: block;
}
</style>
<script>
  function detectAndRedirect() {
    var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    var width = window.innerWidth;
    if (isMobile || width < 768) {
      window.location.href = "index-mobile.html?v=3";
    } else {
      window.location.href = "index-desktop.html?v=3";
    }
  }
  setTimeout(detectAndRedirect, 1800);
</script>
</head>
<body>
  <div class="container">
    <div class="logo-area">
      <img src="fachada.png?v=3" alt="B.D.V. Shopping Virtual">
    </div>
    <h1>B.D.V. SHOPPING VIRTUAL</h1>
    <h2>O Seu Shopping a Um Clique</h2>
    <div class="loading-box">
      <div class="spinner"></div>
      <div class="text-loading">Preparando sua experiência de compras...</div>
      <div class="buttons">
        <a href="index-desktop.html?v=3" class="btn">VERSÃO DESKTOP</a>
        <a href="index-mobile.html?v=3" class="btn btn-secondary">VERSÃO MOBILE</a>
      </div>
    </div>
    <div class="footer-text">
      © 2026 <span>B.D.V. Shopping Virtual</span> - Todos os direitos reservados<br>
      Desenvolvido por Rodrigo Beltrão
    </div>
  </div>
</body>
</html>
