<style>
:root{--cyan:#00f6ff;--magenta:#ff00ff}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#050608;font-family:Arial,sans-serif;color:white;overflow-x:hidden}
.topo{position:relative;width:100%;height:58vh;min-height:380px;background:url("fachada.png") no-repeat center top;background-size:cover;background-color:#050608;display:flex;align-items:center;justify-content:space-between;padding:10px}
.produtos{width:110px;display:flex;flex-direction:column;align-items:center;gap:14px;opacity:0.9}
.produtos img{width:100%;max-width:90px;object-fit:contain;border-radius:10px;background:rgba(255,255,255,0.06);padding:4px}
.base{position:relative;width:100%;background:url("tijolo-fundo.png") no-repeat center;background-size:cover;background-color:#0a0a0a;padding:14px 10px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;border-top:2px solid rgba(0,255,255,0.15)}
.logos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:420px}
.logos a{display:flex;justify-content:center;align-items:center;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:8px}
.logos img{height:52px;width:auto;object-fit:contain}
.logos a.embreve{opacity:0.55;position:relative}
.logos a.embreve::after{content:"EM BREVE";position:absolute;bottom:4px;right:4px;font-size:7px;background:rgba(255,255,255,0.15);padding:2px 4px;border-radius:4px;color:#aaa}
.botoes-mobile{width:100%;max-width:420px;display:flex;gap:10px}
.botao-mobile{flex:1;padding:12px;border-radius:12px;background:rgba(0,0,0,0.45);border:1px solid rgba(0,255,255,0.35);color:var(--cyan);font-weight:bold;text-align:center;text-shadow:0 0 6px var(--cyan),0 0 12px var(--magenta);cursor:pointer;font-size:13px}
.categorias-mobile{width:100%;padding:18px 12px;background:linear-gradient(to bottom, rgba(5,6,8,0.96), rgba(12,14,20,0.98))}
.categorias-mobile h2{font-size:13px;color:var(--cyan);text-align:center;letter-spacing:0.12em;margin:0 0 12px}
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:420px;margin:0 auto}
.cat-card-mobile{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px}
.cat-card-mobile img{width:100%;height:78px;object-fit:cover;border-radius:8px;background:rgba(255,255,255,0.04)}
.cat-card-mobile h4{margin:0;font-size:11px;color:white}
.cat-links{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.btn-m{font-size:8px;padding:5px 2px;border-radius:6px;text-align:center;text-decoration:none;font-weight:800}
.btn-m.ml{background:#fff159;color:#333}.btn-m.magalu{background:#0086ff;color:white}.btn-m.amazon{background:#ff9900;color:white}.btn-m.off{background:rgba(255,255,255,0.08);color:#666}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;justify-content:center;align-items:center;z-index:9999;padding:12px}
.form-container{background:rgba(255,255,255,0.95);padding:20px;border-radius:10px;width:92%;max-width:400px;color:black;max-height:90vh;overflow-y:auto}
.account-container{background:rgba(0,0,0,0.85);padding:20px;border-radius:10px;width:92%;max-width:400px;text-align:center;color:white}
.info{background:rgba(255,255,255,0.1);padding:8px;margin:8px 0;border-radius:5px;text-align:left;font-size:13px}
@media(min-width:768px){.cat-grid{grid-template-columns:repeat(3,1fr);max-width:720px}.logos{max-width:720px;grid-template-columns:repeat(6,1fr)}}
</style>
