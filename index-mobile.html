<style>
:root{--cyan:#00f6ff;--magenta:#ff00ff}
*{box-sizing:border-box}
body{margin:0;background:#050608;color:white;font-family:Arial,sans-serif;overflow-x:hidden}
.topo{width:100%;height:48vh;min-height:300px;background:url("fachada.png") no-repeat center top;background-size:cover}
.base{width:100%;background:url("tijolo-fundo.png") no-repeat center;background-size:cover;background-color:#0a0a0a;padding:12px;display:flex;flex-direction:column;align-items:center;gap:12px;border-top:2px solid rgba(0,255,255,0.15)}
.logos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:400px}
.botao-loja{display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(255,255,255,0.06);border:2px solid rgba(255,255,255,0.08);border-radius:12px;padding:8px;color:white;transition:0.2s;cursor:pointer;min-height:70px}
.botao-loja img{height:38px;object-fit:contain;margin-bottom:4px}
.botao-loja span{font-size:9px;font-weight:800}
.botao-loja.ativo{border-color:var(--cyan);background:rgba(0,246,255,0.15);box-shadow:0 0 18px rgba(0,246,255,0.25)}
.botao-loja.embreve{opacity:0.4}
.botoes{display:flex;gap:8px;width:100%;max-width:400px}
.botoes div{flex:1;padding:10px;border-radius:10px;background:rgba(0,0,0,0.45);border:1px solid rgba(0,255,255,0.35);color:var(--cyan);text-align:center;font-weight:bold;font-size:12px;cursor:pointer}
.categorias-section{display:none;padding:16px 10px;background:#080a12;border-top:2px solid rgba(0,246,255,0.2)}
.categorias-section.visivel{display:block}
.categorias-header{text-align:center;margin-bottom:12px}
.categorias-header h2{font-size:13px;color:var(--cyan);margin:0 0 4px}
.categorias-header p{font-size:11px;color:#888;margin:0}
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:400px;margin:0 auto}
.cat-item{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:10px;overflow:hidden;text-decoration:none;color:white;display:block}
.cat-item img{width:100%;height:90px;object-fit:cover}
.cat-item.info{padding:6px;text-align:center}
.cat-item.info h4{margin:0;font-size:11px}
.cat-item.info span{font-size:9px;background:var(--cyan);color:#000;padding:4px 8px;border-radius:6px;display:inline-block;margin-top:4px;font-weight:800}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;justify-content:center;align-items:center;z-index:9999;padding:12px}
.form-container{background:white;padding:20px;border-radius:10px;width:92%;max-width:360px;color:black}
</style>

</script>
</head>
