<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B.D.V. Shopping Virtual v8</title>
<link rel="icon" type="image/png" href="./icon-192.png?v=8">
<link rel="manifest" href="./manifest.json?v=8">
<script>
(function(){
  if('serviceWorker' in navigator){ navigator.serviceWorker.getRegistrations().then(r=>r.forEach(reg=>reg.unregister())); }
  if('caches' in window){ caches.keys().then(k=>k.forEach(c=>caches.delete(c))); }
  const V="v8"; if(localStorage.getItem('bdv_v')!==V){ localStorage.clear(); sessionStorage.clear(); localStorage.setItem('bdv_v',V); }
})();
</script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#050608;color:#00f6ff;overflow:hidden;height:100vh}
body::before{content:"";position:fixed;inset:0;background:linear-gradient(to right,rgba(0,0,0,0.15),rgba(0,0,0,0.45)),#050608;z-index:-2}
.container{width:100%;height:100vh;display:flex;align-items:center;justify-content:space-between;overflow:hidden}
.vitrine-texto{width:28%;height:100vh;display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;padding:20px;text-align:center;font-weight:bold}
.bloco{width:100%;padding:16px;border-radius:14px;background:rgba(0,0,0,0.35);border:1px solid rgba(0,255,255,0.35);box-shadow:0 0 12px rgba(0,255,255,0.25),0 0 20px rgba(255,0,255,0.18);font-size:15px;text-shadow:0 0 6px #00f6ff,0 0 12px #ff00ff;animation:pulse 3s infinite alternate;cursor:pointer}
.bloco-unico{width:100%;padding:20px;border-radius:14px;background:rgba(0,0,0,0.4);border:2px solid #00f6ff;box-shadow:0 0 12px #00f6ff,0 0 24px #00f6ff,inset 0 0 10px rgba(0,246,255,0.2);font-size:14px;line-height:1.6;color:#00f6ff;text-shadow:0 0 8px #00f6ff,0 0 16px #00f6ff;animation:pulse 3s infinite alternate;text-align:center}
@keyframes pulse{from{transform:scale(0.98);opacity:0.75}to{transform:scale(1.03);opacity:1}}
.fachada-area{width:42%;height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden;position:relative}
.fachada-area img{width:100%;height:100%;object-fit:contain}
.painel-lateral{width:30%;height:100vh;background:linear-gradient(to bottom,rgba(25,25,25,0.96),rgba(10,10,10,0.96));border-left:2px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;padding:20px;overflow-y:auto}
.botao-loja{width:95%;min-height:75px;border-radius:18px;background:rgba(0,0,0,0.3);border:2px solid #00f6ff;display:flex;align-items:center;gap:14px;padding:12px 16px;color:white;transition:0.3s;cursor:pointer;box-shadow:0 0 10px #00f6ff,0 0 20px rgba(0,246,255,0.3),inset 0 0 8px rgba(0,246,255,0.1)}
.botao-loja:hover{transform:scale(1.03);background:rgba(0,255,255,0.12);box-shadow:0 0 15px #00f6ff,0 0 30px #00f6ff}
.botao-loja img{width:60px;height:44px;object-fit:contain;background:rgba(255,255,255,0.9);border-radius:8px;padding:4px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;justify-content:center;align-items:center;z-index:9999;padding:20px}
.form-container{background:rgba(255,255,255,0.95);padding:30px;border-radius:10px;width:90%;max-width:500px;color:black}
.form-container label{display:block;margin-top:10px;font-weight:bold}
.form-container input{width:100%;padding:8px;margin-top:5px;border:1px solid #ccc;border-radius:5px}
.form-container button{margin-top:20px;padding:10px;background:#4CAF50;color:white;border:none;border-radius:5px;width:100%;font-size:16px;cursor:pointer}
.voltar{background:#f44336!important}
.account-container{background:rgba(0,0,0,0.85);padding:30px;border-radius:10px;width:90%;max-width:500px;text-align:center;color:white}
.info{background:rgba(255,255,255,0.1);padding:10px;margin:10px 0;border-radius:5px;text-align:left}
#categoriasOverlay{flex-direction:column;background:rgba(5,6,8,0.98);overflow-y:auto;justify-content:flex-start;align-items:center}
.categorias-header{width:100%;max-width:800px;text-align:center;padding:20px 0;border-bottom:1px solid rgba(0,246,255,0.3);margin-bottom:10px}
.categorias-header h2{font-size:26px;margin:10px 0;color:#00f6ff;text-shadow:0 0 10px #00f6ff}
.categorias-header img{width:100px;background:white;border-radius:10px;padding:6px}
.categorias-lista{width:100%;max-width:800px;display:flex;flex-direction:column;gap:10px;padding:20px 0 40px 0}
.cat-item{width:100%;padding:16px 20px;background:rgba(0,0,0,0.3);border:2px solid #00f6ff;border-radius:12px;color:#fff;font-size:15px;font-weight:bold;cursor:pointer;transition:0.2s;text-align:left;box-shadow:0 0 8px #00f6ff,0 0 16px rgba(0,246,255,0.2)}
.cat-item:hover{background:rgba(0,255,255,0.15);border-color:#00f6ff;transform:translateX(6px);box-shadow:0 0 12px #00f6ff,0 0 24px #00f6ff;color:#00f6ff;text-shadow:0 0 8px #00f6ff}
.btn-voltar-cat{margin:0;padding:12px 24px;border-radius:10px;border:1px solid #ff00ff;background:transparent;color:#ff00ff;cursor:pointer;font-weight:bold}
@media(max-width:1024px){
body{overflow:auto;height:auto;min-height:100vh}
.container{flex-direction:column;height:auto;overflow:visible}
.fachada-area{width:100%;height:70vh;min-height:520px}
.painel-lateral{width:100%;height:auto;border-left:none;border-top:2px solid rgba(255,255,255,0.08);padding:16px;gap:12px}
.painel-lateral h3{width:100%;text-align:center;margin:0 0 8px 0;color:#fff;font-size:16px}
.botao-loja{width:100%;min-height:72px}
/* AJUSTE MOBILE PEDIDO - BOTÕES ABAIXO DO BDV E TEXTO NO RODAPÉ */
.vitrine-texto{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:flex!important;
  flex-direction:column;
  justify-content:space-between;
  align-items:center;
  padding:0;
  z-index:5;
  pointer-events:none;
}
.vitrine-texto.top-botoes{
  display:flex;
  flex-direction:column;
  gap:8px;
  width:150px;
  margin-top:110px;
  pointer-events:auto;
}
.vitrine-texto.top-botoes.bloco{
  padding:10px;
  font-size:11px;
  border-radius:10px;
}
.vitrine-texto.bloco-unico-mobile{
  width:92%;
  max-width:300px;
  margin-bottom:14px;
  padding:12px 8px;
  font-size:11px;
  line-height:1.35;
  border-radius:10px;
  border-width:1.8px;
  pointer-events:none;
}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2?v=8"></script>
<script>
const supabaseUrl="https://vbmxtscxcrrwslyhezwt.supabase.co";
const supabaseKey="sb_publishable_KfIOiYkJHDY8yZbs7ggFTw_hFh8nKAt";
const supabaseClient=supabase.createClient(supabaseUrl,supabaseKey);
const plataformas = {
  mercadolivre: { nome:"Mercado Livre", logo:"logomarca-mercadolivre.png?v=8", base:"https://lista.mercadolivre.com.br/", cats:["Ofertas do dia","Celulares e Telefones","Informática","Eletrodomésticos","TV e Vídeo","Áudio","Casa, Móveis e Decoração","Ferramentas e Construção","Moda Masculina","Moda Feminina","Esportes e Fitness","Beleza e Cuidado Pessoal","Brinquedos e Hobbies","Bebês","Automotivo","Supermercado","Livros","Pet Shop"] },
  magalu: { nome:"Magalu", logo:"logomarca-magalu.png?v=8", base:"https://www.magazineluiza.com.br/busca/", cats:["Smartphones","Informática","TVs","Eletrodomésticos","Móveis","Casa e Decoração","Moda Feminina","Moda Masculina","Calçados","Esporte e Lazer","Beleza e Perfumaria","Brinquedos","Ferramentas","Automotivo","Pet Shop","Alimentos e Bebidas","Livros","Papelaria"] },
  amazon: { nome:"Amazon", logo:"logomarca-amazon.jpg?v=8", base:"https://www.amazon.com.br/s?k=", cats:["Mais Vendidos","Ofertas do Dia","Eletrônicos","Computadores e Informática","Casa e Cozinha","Livros","Moda Feminina","Moda Masculina","Beleza","Cuidados Pessoais","Esportes e Fitness","Brinquedos e Jogos","Ferramentas e Construção","Jardim e Piscina","Automotivo","Alimentos e Bebidas","Pet Shop","Games"] },
  shopee: { nome:"Shopee", logo:"logomarca-Shopee.jpg?v=8", base:"https://shopee.com.br/search?keyword=", cats:["Ofertas Relâmpago","Moda Feminina","Moda Masculina","Celulares e Acessórios","Casa e Decoração","Beleza e Saúde","Bebês e Crianças","Esportes e Lazer","Brinquedos e Hobbies","Automotivo","Ferramentas e Casa","Pet Shop","Supermercado","Livros"] },
  shein: { nome:"Shein", logo:"logomarca-shein.png?v=8", base:"https://br.shein.com/search?search_text=", cats:["Novidades Femininas","Vestidos","Blusas","Calças Femininas","Saias","Moda Praia","Lingerie e Pijamas","Sapatos Femininos","Bolsas e Acessórios","Moda Masculina","Moda Infantil","Plus Size","Casa e Decoração","Beleza","Esporte"] },
  jequiti: { nome:"Jequiti", logo:"logomarca-jequiti.png?v=8", base:"https://www.jequiti.com.br/busca?q=", cats:["Perfumaria Feminina","Perfumaria Masculina","Perfumaria Infantil","Maquiagem - Rosto","Maquiagem - Olhos","Maquiagem - Boca","Corpo e Banho","Cabelos","Hidratantes","Presentes","Kits","Ofertas"] }
};
let plataformaAtual=null;
function abrirPlataforma(id){
  plataformaAtual = plataformas[id];
  document.getElementById('catHeaderNome').innerText = "Você está na plataforma " + plataformaAtual.nome;
  document.getElementById('catHeaderLogo').src = plataformaAtual.logo;
  const lista = document.getElementById('listaCategorias');
  lista.innerHTML = "";
  plataformaAtual.cats.forEach(cat=>{
    const div = document.createElement('div');
    div.className='cat-item';
    div.innerText = cat;
    div.onclick = ()=> abrirCategoria(cat);
    lista.appendChild(div);
  });
  document.getElementById('categoriasOverlay').style.display='flex';
}
function abrirCategoria(catNome){
  if(!plataformaAtual) return;
  let url = "";
  if(plataformaAtual.nome==="Amazon"){ url = plataformaAtual.base + encodeURIComponent(catNome); }
  else { let slug = catNome.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-"); url = plataformaAtual.base + slug; if(plataformaAtual.nome==="Magalu") url = url + "/"; }
  window.open(url,'_blank');
}
function fecharCategorias(){document.getElementById('categoriasOverlay').style.display='none'}
function voltarHome(){document.getElementById('categoriasOverlay').style.display='none'; window.scrollTo({top:0, behavior:'smooth'}); plataformaAtual=null;}
function abrirCadastro(){document.getElementById('cadastroOverlay').style.display='flex'}
function fecharCadastro(){document.getElementById('cadastroOverlay').style.display='none'}
async function abrirConta(){
  document.getElementById('contaOverlay').style.display='flex';
  const {data:{user}} = await supabaseClient.auth.getUser();
  if(user){
    document.getElementById('loginArea').style.display='none';
    document.getElementById('usuarioArea').style.display='block';
    document.getElementById('boasvindas').innerText="Bem-vindo, "+(user.user_metadata?.nome||"Usuário")+"!";
    document.getElementById('dadosConta').innerHTML=`<div class="info">Nome: ${user.user_metadata?.nome||"-"}</div><div class="info">E-mail: ${user.email||"-"}</div>`;
  }else{ document.getElementById('loginArea').style.display='block'; document.getElementById('usuarioArea').style.display='none'; }
}
function fecharConta(){document.getElementById('contaOverlay').style.display='none'}
</script>
</head>
<body>
<div class="container">
<div class="vitrine-texto">
  <div class="top-botoes">
    <div class="bloco" onclick="abrirCadastro()">CADASTRE-SE AQUI</div>
    <div class="bloco" onclick="abrirConta()">MINHA CONTA</div>
  </div>
  <div class="bloco-unico bloco-unico-mobile">
    Milhões de produtos,<br>
    disponíveis<br>
    dentro de um Shopping Virtual<br>
    imersivo<br>
    cyberpunk futurista
  </div>
</div>
<div class="fachada-area">
<img src="fachada.png?v=8" alt="Fachada BDV">
</div>
<div class="painel-lateral">
<h3>ESCOLHA A PLATAFORMA</h3>
<div class="botao-loja" onclick="abrirPlataforma('mercadolivre')"><img src="logomarca-mercadolivre.png?v=8"><span>Mercado Livre</span></div>
<div class="botao-loja" onclick="abrirPlataforma('magalu')"><img src="logomarca-magalu.png?v=8"><span>Magalu</span></div>
<div class="botao-loja" onclick="abrirPlataforma('amazon')"><img src="logomarca-amazon.jpg?v=8"><span>Amazon</span></div>
<div class="botao-loja" onclick="abrirPlataforma('shopee')"><img src="logomarca-Shopee.jpg?v=8"><span>Shopee</span></div>
<div class="botao-loja" onclick="abrirPlataforma('shein')"><img src="logomarca-shein.png?v=8"><span>Shein</span></div>
<div class="botao-loja" onclick="abrirPlataforma('jequiti')"><img src="logomarca-jequiti.png?v=8"><span>Jequiti</span></div>
</div>
</div>
<div class="overlay" id="categoriasOverlay">
<div class="categorias-header">
<img id="catHeaderLogo" src="" alt="">
<h2 id="catHeaderNome">Você está na plataforma</h2>
<p style="color:#aaa;margin:5px 0 0 0">Escolha uma categoria abaixo</p>
</div>
<div class="categorias-lista" id="listaCategorias"></div>
<div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:20px 0 40px 0">
<button class="btn-voltar-cat" onclick="fecharCategorias()">← Voltar para plataformas</button>
<button class="btn-voltar-cat" onclick="voltarHome()" style="border-color:#00f6ff;color:#00f6ff">⌂ Voltar para página inicial</button>
</div>
</div>
<div class="overlay" id="cadastroOverlay">
<div class="form-container">
<h1>Cadastro de Usuário</h1>
<form id="formCadastro">
<label>Nome Completo</label><input type="text" id="nome" required>
<label>Endereço</label><input type="text" id="endereco" required>
<label>RG</label><input type="text" id="rg" required>
<label>CPF</label><input type="text" id="cpf" required>
<label>Celular / WhatsApp</label><input type="tel" id="celular" required>
<label>E-mail</label><input type="email" id="email" required>
<label>Senha</label><input type="password" id="senha" required>
<button type="submit">Cadastrar</button>
</form>
<button class="voltar" onclick="fecharCadastro()">Voltar</button>
</div>
</div>
<div class="overlay" id="contaOverlay">
<div class="account-container">
<h1>Minha Conta</h1>
<div id="loginArea">
<label>E-mail</label><input type="email" id="loginEmail" placeholder="Digite seu e-mail">
<label>Senha</label><input type="password" id="loginSenha" placeholder="Digite sua senha">
<button id="btnLogin">Entrar</button>
</div>
<div id="usuarioArea" style="display:none">
<p id="boasvindas"></p>
<div id="dadosConta"></div>
<button id="btnLogout">Sair</button>
</div>
<button class="voltar" onclick="fecharConta()">Voltar</button>
</div>
</div>
<script>
document.getElementById('btnLogin').addEventListener('click', async ()=>{
  const email=document.getElementById('loginEmail').value;
  const senha=document.getElementById('loginSenha').value;
  const {error}=await supabaseClient.auth.signInWithPassword({email,password:senha});
  if(error){alert('Erro no login: '+error.message);return;}
  abrirConta();
});
document.getElementById('btnLogout').addEventListener('click', async ()=>{
  await supabaseClient.auth.signOut();
  document.getElementById('usuarioArea').style.display='none';
  document.getElementById('loginArea').style.display='block';
});
document.getElementById('formCadastro').addEventListener('submit', async function(e){
  e.preventDefault();
  const nome=document.getElementById('nome').value;
  const email=document.getElementById('email').value;
  const senha=document.getElementById('senha').value;
  const {error}=await supabaseClient.auth.signUp({email,password:senha,options:{data:{nome:nome}}});
  if(error){alert('Erro no cadastro: '+error.message);return;}
  alert('Cadastro realizado com sucesso!');
  fecharCadastro();
});
</script>
</body>
</html>
