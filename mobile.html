<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BDV Mobile NOVO</title>
<style>
html,body{margin:0;padding:0;background:#050608;overflow-x:hidden}
.fachada-mobile{width:100%;background:#050608}
.fachada-bg{width:100%;position:relative;line-height:0}
.fachada-bg img{width:100%;height:auto;display:block}
.botoes-mobile{position:absolute !important;top:128px !important;left:50%;transform:translateX(-50%);width:168px;display:flex;flex-direction:column;gap:12px;z-index:999}
.bloco{width:100%;padding:12px;border-radius:12px;background:rgba(0,0,0,.9);border:1.5px solid #00f6ff;box-shadow:0 0 12px #00f6ff;text-align:center;font-size:11px;font-weight:bold;color:#00f6ff}
.texto-mobile{position:absolute !important;bottom:38px !important;left:50%;transform:translateX(-50%);width:90%;max-width:315px;padding:12px;font-size:11.5px;text-align:center;border-radius:10px;background:rgba(0,0,0,.9);border:2px solid #00f6ff;color:#00f6ff;z-index:999}
.painel-mobile{width:100%;background:#111;padding:16px;display:flex;flex-direction:column;gap:12px}
.botao-loja{border:2px solid #00f6ff;border-radius:18px;padding:12px;display:flex;gap:10px;align-items:center;color:#fff;background:rgba(0,0,0,.3)}
.botao-loja img{width:60px;height:44px;background:#fff;border-radius:8px;padding:4px;object-fit:contain}
</style>
</head>
<body>
<script>alert('ARQUIVO NOVO CARREGOU - top 128px e bottom 38px');</script>
<div class="fachada-mobile">
<div class="fachada-bg">
<img src="fachada.png?v=999" alt="Fachada">
<div class="botoes-mobile"><div class="bloco">CADASTRE-SE AQUI</div><div class="bloco">MINHA CONTA</div></div>
<div class="texto-mobile">Milhões de produtos,<br>disponíveis<br>dentro de um Shopping Virtual<br>imersivo<br>cyberpunk futurista</div>
</div>
<div class="painel-mobile">
<div class="botao-loja"><img src="logomarca-mercadolivre.png"><span>Mercado Livre</span></div>
<div class="botao-loja"><img src="logomarca-magalu.png"><span>Magalu</span></div>
<div class="botao-loja"><img src="logomarca-amazon.jpg"><span>Amazon</span></div>
<div class="botao-loja"><img src="logomarca-Shopee.jpg"><span>Shopee</span></div>
<div class="botao-loja"><img src="logomarca-shein.png"><span>Shein</span></div>
<div class="botao-loja"><img src="logomarca-jequiti.png"><span>Jequiti</span></div>
</div>
</div>
</body>
</html>
