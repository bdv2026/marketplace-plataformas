<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BDV Mobile</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#050608; font-family: Arial, sans-serif; overflow-x:hidden;}
  
  .fachada-bg{
    width:100%;
    position:relative;
    line-height:0;
  }
  .fachada-bg img{
    width:100%;
    height:auto;
    display:block;
  }

  /* LINHA NOVA - Escolha a plataforma com botões nas laterais */
  .linha-plataforma{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    width:92%;
    max-width:360px;
    margin:22px auto 18px auto;
    position:relative;
    z-index:5;
  }
  .btn-lateral{
    padding:9px 11px;
    font-size:9px;
    font-weight:800;
    border:1.5px solid #00f6ff;
    color:#00f6ff;
    border-radius:10px;
    background:rgba(0,0,0,.9);
    text-decoration:none;
    white-space:nowrap;
    letter-spacing:0.5px;
    box-shadow:0 0 10px rgba(0,246,255,.3);
  }
  .texto-plataforma{
    flex:1;
    text-align:center;
    color:#00f6ff;
    font-size:12.5px;
    font-weight:800;
    line-height:1.1;
    text-transform:uppercase;
    text-shadow:0 0 8px #00f6ff;
  }

  /* Painel das lojas - mantido igual ao seu original */
  .painel-mobile{
    width:92%;
    max-width:360px;
    margin:0 auto 30px auto;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .btn-loja{
    width:100%;
    padding:14px;
    background:rgba(10,10,15,.9);
    border:1.5px solid #1a1a2e;
    border-radius:12px;
    color:#fff;
    text-align:left;
    font-size:13px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .btn-loja b{color:#00f6ff}
</style>
</head>
<body>

  <div class="fachada-bg">
    <img src="fachada.png" alt="Fachada BDV">
  </div>

  <div class="linha-plataforma">
    <a href="cadastro.html" class="btn-lateral">CADASTRE-SE</a>
    <div class="texto-plataforma">Escolha a<br>sua plataforma</div>
    <a href="minha-conta.html" class="btn-lateral">MINHA CONTA</a>
  </div>

  <div class="painel-mobile">
    <div class="btn-loja"><span><b>Mercado Livre</b> - Milhões de produtos</span> <span>></span></div>
    <div class="btn-loja"><span><b>Magalu</b> - Vem ser feliz</span> <span>></span></div>
    <div class="btn-loja"><span><b>Amazon</b> - Entrega rápida</span> <span>></span></div>
    <div class="btn-loja"><span><b>Shopee</b> - Frete grátis</span> <span>></span></div>
    <div class="btn-loja"><span><b>AliExpress</b> - Preço baixo</span> <span>></span></div>
    <div class="btn-loja"><span><b>Shein</b> - Moda em alta</span> <span>></span></div>
  </div>

</body>
</html>
