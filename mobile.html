<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>body{margin:0;background:#050608}</style>
</head>
<body>
<div id="bdv-wrapper" style="width:100%;position:relative;line-height:0;">
  <img id="bdv-img" src="fachada.png" style="width:100%;height:auto;display:block;">
  
  <div id="bdv-botoes" style="position:absolute;top:128px;left:50%;transform:translateX(-50%);width:168px;display:flex;flex-direction:column;gap:12px;z-index:9999;">
    <div style="padding:12px;border-radius:12px;background:rgba(0,0,0,.9);border:1.5px solid #00f6ff;color:#00f6ff;text-align:center;font-size:11px;font-weight:bold;">CADASTRE-SE AQUI - 128px</div>
    <div style="padding:12px;border-radius:12px;background:rgba(0,0,0,.9);border:1.5px solid #00f6ff;color:#00f6ff;text-align:center;font-size:11px;font-weight:bold;">MINHA CONTA</div>
  </div>

  <div id="bdv-texto" style="position:absolute;bottom:38px;left:50%;transform:translateX(-50%);width:90%;max-width:315px;padding:12px;background:rgba(0,0,0,.9);border:2px solid #00f6ff;color:#00f6ff;text-align:center;border-radius:10px;font-size:11.5px;z-index:9999;">
    TEXTO 38px - Se você está lendo isso, o arquivo NOVO carregou
  </div>
</div>
<script>
window.onload = function(){
  alert('NOVO ARQUIVO - Se apareceu isso, é o código com 128px e 38px');
  document.getElementById('bdv-botoes').style.top = '128px';
  document.getElementById('bdv-texto').style.bottom = '38px';
}
</script>
</body>
</html>
